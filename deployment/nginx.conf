# Include within the existing website server block. Legacy package/API routes stay compatible.
location = /asterhub { return 301 /asterhub/; }
location = /aqserver { return 301 /asterhub/; }
location = /aqserver/ { return 301 /asterhub/; }
location = /aqserver/releases/stable.json {
    alias /var/www/aqserver-web/current/releases/stable.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location ^~ /asterhub/assets/ {
    alias /var/www/aqserver-web/current/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /asterhub/media/ {
    alias /var/www/aqserver-web/current/media/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /asterhub/ {
    alias /var/www/aqserver-web/current/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location ^~ /aqserver/assets/ {
    alias /var/www/aqserver-web/current/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /aqserver/ {
    alias /var/www/aqserver-web/current/;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
