name: Verify AsterHub
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-source.py
      - run: python -m unittest discover -s agent/linux -p 'test_*.py'
      - run: python -m unittest discover -s deployment/feedback -p 'test_*.py'
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci
        working-directory: desktop/web
      - run: npm run test:foundation
        working-directory: desktop/web
      - run: npm run check:foundation
        working-directory: desktop/web
      - name: Build Windows program from source
        shell: powershell
        run: ./desktop/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AsterHub-Windows
          path: desktop/app
          retention-days: 7
