name: 缺陷报告
description: 提供版本、复现步骤和实际观察，便于修复与复测。
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: input
    id: version
    attributes:
      label: 测试版本
      placeholder: 例如 0.1.0；从关于页面确认
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 测试对象
      options: [Windows 客户端, 官网]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 执行环境
      description: Windows/浏览器版本、分辨率、缩放、主题，以及是否真实执行。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 观察…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 截图、录屏、脱敏日志或私有证据路径；请勿提交密码、密钥和其他用户数据。
  - type: checkboxes
    id: boundary
    attributes:
      label: 验证边界
      options:
        - label: 我已区分真实操作、模拟数据、静态分析与未测试项目。
          required: true
