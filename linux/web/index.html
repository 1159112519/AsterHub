<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AQ Server</title><link rel="icon" href="/assets/icon.ico"><link rel="stylesheet" href="/assets/vendor/xterm.css"><link rel="stylesheet" href="/assets/app.css"></head>
<body><div class="app-shell">
<aside class="sidebar"><a class="brand" href="/"><img src="/assets/icon.ico" alt=""><span>AQ Server<small>YOUR SERVER, IN FOCUS.</small></span></a>
<div class="section-label">工作空间<button class="icon-button" id="add-device" title="添加设备" aria-label="添加设备"><i data-lucide="plus"></i></button></div><div id="devices" class="devices"></div>
<div class="side-section"><div class="section-label">当前设备</div><dl id="device-specs"></dl></div>
<div class="side-charts"><div>CPU <span id="side-cpu">—</span></div><canvas id="side-cpu-chart"></canvas><div>GPU <span id="side-gpu">—</span></div><canvas id="side-gpu-chart"></canvas></div>
<div class="side-bottom"><div class="record-state"><i data-lucide="database"></i><span>本机存档<small id="archive-count">等待采集</small></span><b class="status-dot"></b></div><button id="settings-button" class="settings-nav"><i data-lucide="settings-2"></i>偏好设置</button><span class="version-label" id="version">AQ WORKSPACE · UBUNTU</span></div></aside>
<main class="workspace"><header class="app-header"><div><div class="eyebrow">WORKSPACE</div><div class="identity"><h1 id="device-name">本机</h1><span id="connection" class="connection">正在读取</span></div></div><div class="header-actions"><span id="latency">本机</span><button id="transfers-button" class="icon-button" title="传输队列" aria-label="传输队列"><i data-lucide="arrow-down-up"></i><span id="transfer-count" class="badge" hidden></span></button><button id="about-button" class="icon-button" title="关于 AQ Server" aria-label="关于 AQ Server"><i data-lucide="info"></i></button></div></header>
<nav class="main-nav" aria-label="主导航"><button data-view="cpu" class="active"><i data-lucide="cpu"></i>CPU</button><button data-view="gpu"><i data-lucide="circuit-board"></i>GPU</button><button data-view="memory"><i data-lucide="memory-stick"></i>内存</button><button data-view="terminal"><i data-lucide="terminal"></i>终端</button><button data-view="files"><i data-lucide="folder"></i>文件</button><button data-view="history"><i data-lucide="history"></i>历史</button></nav>
<div id="stale-banner" class="stale-banner" hidden></div>
<div class="view-host"><section id="view-cpu" class="view active"></section><section id="view-gpu" class="view"></section><section id="view-memory" class="view"></section><section id="view-terminal" class="view workbench-view"></section><section id="view-files" class="view workbench-view"></section><section id="view-history" class="view"></section></div>
<footer class="resource-dock"><div class="dock-item"><i data-lucide="cpu"></i><span>CPU</span><strong id="dock-cpu">—<small>%</small></strong><canvas id="dock-cpu-chart"></canvas></div><div class="dock-item"><i data-lucide="circuit-board"></i><span>GPU</span><strong id="dock-gpu">—<small>%</small></strong><canvas id="dock-gpu-chart"></canvas></div><div class="dock-item"><i data-lucide="memory-stick"></i><span>内存</span><strong id="dock-memory">—<small>GiB</small></strong><canvas id="dock-memory-chart"></canvas></div></footer>
</main></div><div id="toast" role="status" class="toast" hidden></div><dialog id="modal"><div id="modal-content"></div></dialog><input type="file" id="upload-input" multiple hidden><input type="file" id="folder-input" webkitdirectory multiple hidden>
<script src="/assets/vendor/lucide.js"></script><script src="/assets/vendor/xterm.js"></script><script src="/assets/vendor/addon-fit.js"></script><script type="module" src="/assets/main.js"></script></body></html>
