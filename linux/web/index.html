<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AQ Server</title><link rel="icon" href="/assets/icon.ico"><link rel="stylesheet" href="/assets/vendor/xterm.css"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/foundation.css"></head>
<body><div class="app-shell">
<aside class="sidebar"><a class="brand" href="/"><img src="/assets/icon.ico" alt=""><span>AQ Server<small>设备工作台</small></span></a>
<div class="side-scroll"><div class="section-label">设备<button class="icon-button" id="add-device" title="添加设备" aria-label="添加设备"><i data-lucide="plus"></i></button></div><div id="devices" class="devices"></div><nav class="main-nav" aria-label="主导航"><span class="nav-group-label">资源监控</span><button data-view="cpu" class="active" title="处理器"><i data-lucide="cpu"></i><span>处理器</span></button><button data-view="gpu" title="显卡"><i data-lucide="gpu"></i><span>显卡</span></button><button data-view="memory" title="内存"><i data-lucide="memory-stick"></i><span>内存</span></button><button data-view="network" title="网络"><i data-lucide="network"></i><span>网络</span></button><button data-view="storage" title="存储"><i data-lucide="hard-drive"></i><span>存储</span></button><span class="nav-group-label">工作台</span><button data-view="terminal" title="终端"><i data-lucide="terminal"></i><span>终端</span></button><button data-view="files" title="文件"><i data-lucide="folder"></i><span>文件</span></button><button data-view="history" title="历史"><i data-lucide="history"></i><span>历史</span></button></nav>
<div class="side-section"><div class="section-label">当前设备</div><dl id="device-specs"></dl></div>
<div class="side-charts"><div>CPU <span id="side-cpu">—</span></div><canvas id="side-cpu-chart"></canvas><div>GPU <span id="side-gpu">—</span></div><canvas id="side-gpu-chart"></canvas></div>
</div><div class="side-bottom"><div class="record-state"><i data-lucide="database"></i><span>本机存档<small id="archive-count">等待采集</small></span><b class="status-dot"></b></div><button id="settings-button" class="settings-nav"><i data-lucide="settings-2"></i>偏好设置</button><span class="version-label" id="version">AQ WORKSPACE · UBUNTU</span></div></aside>
<main class="workspace"><header class="app-header"><div class="page-heading"><span class="page-icon" id="page-icon"><i data-lucide="cpu"></i></span><div><h1 id="page-title">CPU 运行状态</h1><div class="identity"><span id="device-name">本机</span><span id="connection" class="connection">正在读取</span></div></div></div><div class="header-actions"><span id="latency">本机</span><button id="transfers-button" class="icon-button" title="传输队列" aria-label="传输队列"><i data-lucide="arrow-down-up"></i><span id="transfer-count" class="badge" hidden></span></button><button id="about-button" class="icon-button" title="关于 AQ Server" aria-label="关于 AQ Server"><i data-lucide="info"></i></button></div></header>

<div id="stale-banner" class="stale-banner" hidden></div>
<div class="view-host"><section id="view-cpu" class="view active"></section><section id="view-gpu" class="view"></section><section id="view-memory" class="view"></section><section id="view-network" class="view"></section><section id="view-storage" class="view"></section><section id="view-terminal" class="view workbench-view"></section><section id="view-files" class="view workbench-view"></section><section id="view-history" class="view"></section></div>
<footer class="resource-dock" aria-label="实时资源">
<button class="dock-item dock-cpu" data-view="cpu"><span>CPU</span><strong id="dock-cpu">—<small>%</small></strong><canvas id="dock-cpu-chart"></canvas></button>
<button class="dock-item dock-gpu" data-view="gpu"><span>GPU</span><strong id="dock-gpu">—<small>%</small></strong><canvas id="dock-gpu-chart"></canvas></button>
<button class="dock-item dock-memory" data-view="memory"><span>内存</span><strong id="dock-memory">—<small>GiB</small></strong><canvas id="dock-memory-chart"></canvas></button>
<button class="dock-item dock-network" id="dock-network-group" data-view="network"><span>网络</span><span class="dock-readings"><strong id="dock-upload">—</strong><small id="dock-download">—</small></span><canvas id="dock-network-chart"></canvas></button>
<button class="dock-item dock-storage" id="dock-storage-group" data-view="storage"><span>存储</span><span class="dock-readings"><strong id="dock-storage">—</strong><small id="dock-capacity">—</small></span><span id="dock-storage-meter" class="dock-meter"><i></i></span></button>
</footer>
</main></div><div id="toast" role="status" class="toast" hidden></div><dialog id="modal"><div id="modal-content"></div></dialog><input type="file" id="upload-input" multiple hidden><input type="file" id="folder-input" webkitdirectory multiple hidden>
<script src="/assets/vendor/lucide.js"></script><script src="/assets/vendor/xterm.js"></script><script src="/assets/vendor/addon-fit.js"></script><script type="module" src="/assets/main.js"></script></body></html>
